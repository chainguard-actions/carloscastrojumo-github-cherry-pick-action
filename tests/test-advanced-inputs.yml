name: Test advanced cherry pick inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          branch: release/v2.0
          cherry-pick-branch: cherry-pick/feature-branch
          force: "true"
          assignees: "octocat"
          reviewers: "octocat"
          team-reviewers: "my-team"
          inherit_labels: "false"
      - name: Assert action ran (may fail due to missing GitHub context)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with advanced inputs"
