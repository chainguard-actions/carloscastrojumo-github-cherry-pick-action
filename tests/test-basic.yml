name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The cherry-pick action requires a PR context (it reads the PR that triggered
      # the workflow). Under workflow_dispatch there is no PR, so the action will
      # fail with a runtime error about missing PR data — NOT a configuration error.
      # We verify the action starts, loads, and fails with a meaningful error
      # (not "Cannot find module" or similar setup failures).
      - id: action
        uses: .
        with:
          branch: main
        continue-on-error: true

      - name: Assert action ran (not a setup/module error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have run (and failed due to no PR context),
          # not errored out due to missing dist/index.js or bad configuration.
          # Both 'success' and 'failure' are acceptable — 'skipped' is not.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
