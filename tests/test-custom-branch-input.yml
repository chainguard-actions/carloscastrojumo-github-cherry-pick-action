name: Test cherry-pick action with custom branch and title inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts optional inputs (title, body, labels)
      # alongside the required branch input. Without a real PR context the
      # action will fail, but it should fail gracefully (not crash/throw
      # an unhandled exception).
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          branch: release/v1.0
          title: "Cherry-pick: {old_title}"
          body: "Cherry-pick of #{old_pull_request_id}"
          labels: "cherry-pick,automated"
          committer: "GitHub Actions <noreply@github.com>"
          author: "Test User <test@example.com>"

      - name: Assert action failed gracefully (no PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when there is no PR context, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when invoked without a PR context"
