name: Test custom title and body inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts custom title and body inputs.
      # Under act (workflow_dispatch), there is no PR payload, so the action
      # is expected to fail. We verify it fails (not silently no-ops) and
      # that the inputs are accepted without argument parsing errors.
      - id: cherry_pick
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          branch: release/v1.0
          title: "Cherry pick: {old_title}"
          body: "Cherry picked from PR #{old_pull_request_id}"
          labels: "cherry-pick,automated"
          inherit_labels: "false"

      - name: Assert action failed due to missing PR context
        env:
          OUTCOME: ${{ steps.cherry_pick.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail without PR context, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed without a pull_request event context (custom title/body inputs accepted)"
