name: Test reviewers and assignees inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts reviewers, assignees, and team-reviewers inputs.
      # Under act (workflow_dispatch), there is no PR payload, so the action
      # is expected to fail. We verify it fails gracefully and that the
      # optional reviewer/assignee inputs are accepted without argument parsing errors.
      - id: cherry_pick
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          branch: release/v3.0
          assignees: "octocat"
          reviewers: "octocat"
          team-reviewers: "my-team"

      - name: Assert action failed due to missing PR context
        env:
          OUTCOME: ${{ steps.cherry_pick.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail without PR context, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed without a pull_request event context (reviewers/assignees inputs accepted)"
