name: Test team-reviewers input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          branch: main
          team-reviewers: my-team
          title: "Cherry pick: {old_title}"
          body: "Cherry pick of #{old_pull_request_id}"
      - name: Assert action ran with team-reviewers input
        run: |
          # The action is expected to fail in a non-PR context (no PR number available),
          # but the important thing is that the team-reviewers input was accepted and
          # the action attempted to run (not a configuration/input parsing error).
          OUTCOME="${{ steps.action.outcome }}"
          echo "action outcome: $OUTCOME"
          # Accept either success or failure — both indicate the input was processed.
          # A setup/parse error would surface differently (e.g. "Input required and not supplied").
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted team-reviewers input and ran"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
