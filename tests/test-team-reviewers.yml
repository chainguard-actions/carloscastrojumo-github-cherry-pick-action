name: Test team-reviewers input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with team-reviewers input
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          branch: main
          cherry-pick-branch: cherry-pick/team-reviewers-test
          title: "Cherry pick: {old_title}"
          body: "Cherry pick of #{old_pull_request_id}"
          labels: "cherry-pick"
          assignees: ""
          reviewers: ""
          team-reviewers: "maintainers"
          force: "false"

      - name: Assert action was invoked
        run: |
          # The action requires a real PR context (pull_request event) to cherry-pick.
          # Under workflow_dispatch there is no PR, so the action is expected to fail
          # or exit early. We verify it was at least invoked (outcome is set).
          OUTCOME="${{ steps.action.outcome }}"
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with team-reviewers input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
